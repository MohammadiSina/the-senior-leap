# Supported providers: ollama, anthropic, openrouter, groq
provider: openrouter

# Model name.
# Ollama: 'llama3.2', 'qwen2.5-coder'
# Anthropic: 'claude-3-5-sonnet-20241022'
# OpenRouter: 'openrouter/free', 'meta-llama/llama-3-8b-instruct:free', 'anthropic/claude-3.5-sonnet'
# Groq: 'llama-3.1-8b-instant'
model: 'openrouter/free'

# API Key (Required for cloud solutions. Leave blank for Ollama)
api_key: your-api-key-here

# Base URL (Only used for Ollama)
base_url: http://localhost:11434
